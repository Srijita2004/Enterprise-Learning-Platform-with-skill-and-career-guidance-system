spring.application.name=certification-management-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillsphere_certification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:srijita}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

certification.expiry.default-warning-days=30
certification.expiry.maximum-warning-days=365
certification.scheduler.cron=${CERTIFICATION_SCHEDULER_CRON:0 5 0 * * *}
integration.m1.base-url=${M1_BASE_URL:http://localhost:8085/api}
integration.m1.employee-validation-enabled=${M1_EMPLOYEE_VALIDATION_ENABLED:true}

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# Kafka Topics
kafka.topic.certificate-issued=certificate-issued
kafka.topic.certificate-renewed=certificate-renewed
