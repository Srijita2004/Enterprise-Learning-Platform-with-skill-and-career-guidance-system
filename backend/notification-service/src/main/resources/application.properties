spring.application.name=notification-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillsphere_notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Kafka Producer Configuration (for the outbound notification-created event)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# Kafka Consumer Configuration (for the 5 inbound domain event topics)
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Topics
kafka.topic.employee-created=employee-created
kafka.topic.skill-updated=skill-updated
kafka.topic.course-completed=course-completed
kafka.topic.certificate-issued=certificate-issued
kafka.topic.certificate-renewed=certificate-renewed
kafka.topic.notification-created=notification-created

