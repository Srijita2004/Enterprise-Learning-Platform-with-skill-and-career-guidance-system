server {
    listen 80;
    server_name localhost;

    # Milestone 1 (Skill Management) — forwarded to the API Gateway unchanged
    location /api/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Milestone 2 (Learning Service) — via the /learning-api Gateway route
    location /learning-api/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Milestone 3 (Certification Management) — via the /certification-api Gateway route
    location /certification-api/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification Service (bell icon) — via the /notification-api Gateway route.
    # This block was missing entirely, so the built container had no way to
    # reach the notification service at all.
    location /notification-api/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}